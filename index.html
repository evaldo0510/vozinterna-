<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        // Safeguard against third-party libraries/polyfills writing to window.fetch when it is a read-only getter
        (function() {
            try {
                var originalFetch = window.fetch;
                var currentFetch = originalFetch;
                
                Object.defineProperty(window, 'fetch', {
                    get: function() {
                        return currentFetch || originalFetch;
                    },
                    set: function(newValue) {
                        currentFetch = newValue;
                    },
                    configurable: true,
                    enumerable: true
                });
                
                if (typeof globalThis !== 'undefined' && globalThis !== window) {
                    try {
                        Object.defineProperty(globalThis, 'fetch', {
                            get: function() {
                                return currentFetch || originalFetch;
                            },
                            set: function(newValue) {
                                currentFetch = newValue;
                            },
                            configurable: true,
                            enumerable: true
                        });
                    } catch (ge) {}
                }
            } catch (e) {
                console.warn('Could not intercept/define custom fetch property:', e);
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voz Interior PCH • Dr. Evaldo</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#080b14">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080b14;
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(45, 212, 191, 0.2);
            border-radius: 10px;
        }
        
        @keyframes orbit {
            from { transform: rotate(0deg) translateX(5px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(5px) rotate(-360deg); }
        }

        .liquid-bg {
            filter: blur(100px);
            opacity: 0.35;
            transition: all 3s ease;
        }

        /* ResponsiveLayout global mobile CSS abstractions */
        .ResponsiveLayout {
            width: 100%;
            max-width: 100vw;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* Clean vertical flow adjustments, paddings and font scale optimizations for mobile devices */
        @media (max-width: 640px) {
            .ResponsiveLayout {
                padding-left: 0.75rem;
                padding-right: 0.75rem;
            }
            .mobile-p-density {
                padding: 1rem !important;
            }
            .mobile-m-density {
                margin: 0.75rem 0 !important;
            }
            
            /* Responsive global text overrides under ResponsiveLayout boundary */
            .ResponsiveLayout h1 {
                font-size: 1.75rem !important;
                line-height: 2.25rem !important;
                letter-spacing: -0.02em !important;
            }
            .ResponsiveLayout h2, .ResponsiveLayout .text-2xl, .ResponsiveLayout .text-3xl {
                font-size: 1.35rem !important;
                line-height: 1.85rem !important;
                letter-spacing: -0.01em !important;
            }
            .ResponsiveLayout h3, .ResponsiveLayout .text-xl {
                font-size: 1.15rem !important;
                line-height: 1.6rem !important;
            }
            .ResponsiveLayout p, .ResponsiveLayout .text-base, .ResponsiveLayout .text-sm {
                font-size: 0.85rem !important;
                line-height: 1.35rem !important;
            }
            .ResponsiveLayout span:not(.font-mono), .ResponsiveLayout .text-xs {
                font-size: 0.75rem !important;
                line-height: 1.15rem !important;
            }
        }

        /* Enforce native 44px touch targets on buttons, tags, or links inside ResponsiveLayout */
        button,
        [role="button"],
        .clickable-touch,
        .interactive-element {
            min-height: 44px;
            min-width: 44px;
            box-sizing: border-box;
            transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.12s ease, opacity 0.12s ease, border-color 0.12s ease !important;
        }

        /* Tactile Feedback active:scale-95 rule for gorgeous click responsiveness */
        button:active,
        [role="button"]:active,
        .clickable-touch:active,
        .interactive-element:active,
        .active\:scale-95:active {
            transform: scale(0.95) !important;
            opacity: 0.9 !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
